# =============================================================================
# docker-compose.offline.yml — self-contained offline stack
#
# Bundles the parking backend + frontend so the app runs on an air-gapped
# host. Couchbase is NOT bundled here — point the backend at an external
# Couchbase cluster via COUCHBASE_CONNECTION_STRING in .env.
#
# Load the images first (see README-OFFLINE.md), then:
#   docker compose -f docker-compose.offline.yml --env-file .env up -d
# =============================================================================

name: parking-app-offline

services:

  backend:
    image: parking-backend:v1.0.0
    container_name: parking_backend
    restart: unless-stopped
    environment:
      DB_TYPE: couchbase
      COUCHBASE_CONNECTION_STRING: ${COUCHBASE_CONNECTION_STRING}
      COUCHBASE_BUCKET: ${COUCHBASE_BUCKET}
      COUCHBASE_USERNAME: ${COUCHBASE_USERNAME}
      COUCHBASE_PASSWORD: ${COUCHBASE_PASSWORD}
      COUCHBASE_DEPLOYMENT: ${COUCHBASE_DEPLOYMENT:-enterprise}
      COUCHBASE_TLS_VERIFY: ${COUCHBASE_TLS_VERIFY:-none}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-0.5}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD}
      FIRST_ADMIN_COMPANY: ${FIRST_ADMIN_COMPANY:-Cebuana Lhuillier}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RUN_BACKGROUND_TASKS: ${RUN_BACKGROUND_TASKS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      UPLOAD_DIR: /var/lib/parking/uploads
    volumes:
      - parking_uploads:/var/lib/parking/uploads
    expose:
      - "8001"

  frontend:
    image: parking-frontend:v1.0.0
    container_name: parking_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    # Override the baked-in healthcheck: Alpine wget resolves "localhost" to
    # IPv6 (::1) first, but nginx listens on IPv4 here — use 127.0.0.1.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  parking_uploads:
