# Parking Reservation — Huawei Cloud Stack (on-prem) compose
#
# This variant is runnable on the LOCALLY-BUILT images out of the box:
#   parking-backend:v1.0.0  and  parking-frontend:v1.0.0
#
# It defaults to plain HTTP (port 80) using the image's baked-in nginx.conf,
# so no TLS certificates are required to bring the stack up for validation.
#
# To target the customer's HCS registry instead, set in .env:
#   IMAGE_REF_PREFIX=registry.your-hcs.local/cebuana-parking/
#   IMAGE_TAG=v1.0.0
# (the prefix must end with a trailing slash). Leave IMAGE_REF_PREFIX empty
# to use the local images.
#
# What you supply at the on-prem host:
#   1. .env                         — Couchbase + JWT + admin settings
#   2. ${COUCHBASE_TRUST_STORE_HOST_PATH} — Couchbase CA cert (PEM), OPTIONAL
#
# Bring up:
#   docker compose -f docker-compose.onprem.yml --env-file .env up -d
# Bring down (containers only, data preserved):
#   docker compose -f docker-compose.onprem.yml down
# Bring down (containers + volumes — DESTRUCTIVE):
#   docker compose -f docker-compose.onprem.yml down -v

name: parking-app

services:

  backend:
    image: ${IMAGE_REF_PREFIX:-}parking-backend:${IMAGE_TAG:-v1.0.0}
    container_name: parking_backend
    restart: unless-stopped
    environment:
      DB_TYPE: couchbase

      # Couchbase Enterprise (on-prem)
      COUCHBASE_CONNECTION_STRING: ${COUCHBASE_CONNECTION_STRING}
      COUCHBASE_BUCKET: ${COUCHBASE_BUCKET}
      COUCHBASE_USERNAME: ${COUCHBASE_USERNAME}
      COUCHBASE_PASSWORD: ${COUCHBASE_PASSWORD}
      COUCHBASE_DEPLOYMENT: ${COUCHBASE_DEPLOYMENT:-enterprise}
      # CA trust store path inside the container. Only used if the file is
      # mounted (see volumes below); harmless otherwise.
      COUCHBASE_TRUST_STORE_PATH: ${COUCHBASE_TRUST_STORE_PATH:-}
      COUCHBASE_TLS_VERIFY: ${COUCHBASE_TLS_VERIFY:-peer}

      # Auth / JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-0.5}

      # Default admin override (seeded only on first boot)
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
      FIRST_ADMIN_COMPANY: ${FIRST_ADMIN_COMPANY:-Cebuana Lhuillier}

      # Background maintenance loops. ONLY one replica should run them; set
      # this to "false" on every additional replica.
      RUN_BACKGROUND_TASKS: ${RUN_BACKGROUND_TASKS:-true}

      # Cookie security — set to false for plain-HTTP validation, true behind TLS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      # CORS — for nginx-fronted same-origin deploys this is unused
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

      UPLOAD_DIR: /var/lib/parking/uploads

    volumes:
      - parking_uploads:/var/lib/parking/uploads
      # Optional Couchbase Enterprise cluster CA cert. Defaults to /dev/null so
      # the stack starts without a cert file present. To use one, set
      # COUCHBASE_TRUST_STORE_HOST_PATH to the host PEM path and
      # COUCHBASE_TRUST_STORE_PATH=/etc/ssl/cb-ca.pem in .env.
      - ${COUCHBASE_TRUST_STORE_HOST_PATH:-/dev/null}:/etc/ssl/cb-ca.pem:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

    expose:
      - "8001"

  frontend:
    image: ${IMAGE_REF_PREFIX:-}parking-frontend:${IMAGE_TAG:-v1.0.0}
    container_name: parking_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

    ports:
      # Plain HTTP on the host. The image's baked-in nginx.conf serves the SPA
      # and reverse-proxies /api to the backend. Change to a TLS setup by
      # mounting nginx.onprem.conf + certs and exposing 443.
      - "${HTTP_PORT:-8080}:80"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  parking_uploads:
