# nginx config for the on-prem deployment with TLS termination at the
# frontend container. Mounted at /etc/nginx/conf.d/app.conf in compose.
#
# Files expected in the container at runtime (mounted from the host):
#   /etc/ssl/parking/fullchain.pem  — server cert + intermediate chain
#   /etc/ssl/parking/privkey.pem    — server private key
#
# Generate them on the host and bind-mount via docker-compose.onprem.yml.

upstream parking_backend {
    server backend:8001;
}

# ---- Plain HTTP: redirect everything to HTTPS -----------------------------
server {
    listen 80 default_server;
    server_name _;

    # Allow ACME http-01 challenge if you ever use Let's Encrypt internally.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: the real server -----------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/parking/fullchain.pem;
    ssl_certificate_key /etc/ssl/parking/privkey.pem;

    # Modern, conservative TLS settings (Mozilla intermediate, OpenSSL 3.x).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS — only enable AFTER you've confirmed the cert renews reliably.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Reasonable defaults
    client_max_body_size 10m;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Cheap health endpoint
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API and uploaded-image paths -> FastAPI backend
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_pass http://parking_backend;
    }

    # Long-cache the hashed CRA asset bundles
    location /static/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # React Router — always serve index.html for unknown paths
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
