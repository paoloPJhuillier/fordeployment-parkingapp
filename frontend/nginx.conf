# nginx server config for the parking app frontend container.
# - Serves the static React SPA (History API fallback)
# - Reverse-proxies /api/* to the backend service (same-origin to avoid CORS
#   and to keep HttpOnly auth cookies working cleanly)

upstream parking_backend {
    # Resolved via the Docker/Kubernetes DNS when running in docker-compose / k8s.
    # Overridable by regenerating this file in a derived image if your backend
    # service name differs.
    server backend:8001;
}

server {
    listen 80;
    server_name _;

    # Reasonable defaults for a React SPA that serves uploaded images too.
    client_max_body_size 10m;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Cheap health endpoint (no backend required)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API and uploaded-image paths go to the FastAPI backend
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_pass http://parking_backend;
    }

    # Long-cache the hashed CRA asset bundles
    location /static/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # React Router — always serve index.html for unknown paths
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;

        # Basic security headers for the static HTML (backend adds its own on /api)
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
