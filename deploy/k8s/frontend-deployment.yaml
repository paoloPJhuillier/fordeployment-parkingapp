# Frontend deployment — nginx serving the static React bundle and reverse
# proxying /api/* to the `backend` Service. Stateless and trivially scalable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-frontend
  namespace: parking-app
  labels:
    app.kubernetes.io/name: parking-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: parking-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parking-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: REGISTRY/parking-frontend:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "192Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: parking-app
  labels:
    app.kubernetes.io/name: parking-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: parking-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
