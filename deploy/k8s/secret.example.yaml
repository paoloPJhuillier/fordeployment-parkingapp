# EXAMPLE Secret manifest — DO NOT commit the real values.
#
# Either:
#   1. Copy this file to `secret.yaml`, fill in real values, and apply it:
#        kubectl apply -f secret.yaml
#      (add `secret.yaml` to .gitignore)
#
#   2. Or create the secret imperatively (preferred for CI):
#        kubectl -n parking-app create secret generic parking-backend-secrets \
#          --from-literal=JWT_SECRET="$(openssl rand -hex 64)" \
#          --from-literal=COUCHBASE_USERNAME="parking_app" \
#          --from-literal=COUCHBASE_PASSWORD="<paste>" \
#          --from-literal=FIRST_ADMIN_PASSWORD="<paste>" \
#          --from-literal=OBS_ACCESS_KEY="<AK>" \
#          --from-literal=OBS_SECRET_KEY="<SK>" \
#          --from-literal=EMERGENT_LLM_KEY="<optional>"
apiVersion: v1
kind: Secret
metadata:
  name: parking-backend-secrets
  namespace: parking-app
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_OPENSSL_RAND_HEX_64"
  COUCHBASE_USERNAME: "parking_app"
  COUCHBASE_PASSWORD: "REPLACE_ME"
  FIRST_ADMIN_PASSWORD: "REPLACE_ME_STRONG_16+_CHARS"
  OBS_ACCESS_KEY: "REPLACE_ME"
  OBS_SECRET_KEY: "REPLACE_ME"
  EMERGENT_LLM_KEY: ""
  # Used only when DB_TYPE=mongodb in the ConfigMap. Leave blank for Couchbase.
  MONGO_URL: ""
---
# Couchbase Enterprise root CA — mounted into the backend pods so the SDK
# trusts the self-issued cluster cert. Generate the file with:
#   kubectl -n parking-app create secret generic parking-cb-ca \
#       --from-file=cb-ca.pem=./cb-ca.pem
#
# This stub is here so `kustomize build` doesn't fail on a fresh checkout.
apiVersion: v1
kind: Secret
metadata:
  name: parking-cb-ca
  namespace: parking-app
type: Opaque
stringData:
  cb-ca.pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE WITH YOUR COUCHBASE CLUSTER ROOT CERTIFICATE
    -----END CERTIFICATE-----
