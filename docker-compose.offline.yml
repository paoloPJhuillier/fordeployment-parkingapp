# =============================================================================
# docker-compose.offline.yml — self-contained offline stack
#
# Bundles the parking backend + frontend so the app runs on an air-gapped
# host. Couchbase is NOT bundled here — point the backend at an external
# Couchbase cluster via COUCHBASE_CONNECTION_STRING in .env.
#
# The app images are used AS-IS from the local Docker image store
# (pull_policy: never) — nothing is fetched from Docker Hub / a registry.
#
# STEP 1 — Load the app images from the shipped tarballs (offline-bundle/):
#   docker load -i offline-bundle/parking-backend-v1.0.0.tar
#   docker load -i offline-bundle/parking-frontend-v1.0.0.tar
#
# STEP 2 — Start the app (backend connects to the external Couchbase in .env):
#   docker compose -f docker-compose.offline.yml --env-file .env up -d
#
# -----------------------------------------------------------------------------
# AIR-GAPPED CONNECTIVITY (fixing Couchbase UnAmbiguousTimeoutException)
#
# The timeout means the backend container could not reach the Couchbase host
# named in COUCHBASE_CONNECTION_STRING. First confirm where it breaks:
#   docker run --rm busybox nslookup <couchbase-host>     # container DNS
#   nc -vz <couchbase-host> 8091                          # host reachability
#
# Then apply the override file docker-compose.airgap.yml, which pins the
# cluster hostname to its IP (and/or sets an internal DNS server). Edit the
# IP/host in that file to match your cluster, then start with BOTH files:
#   docker compose -f docker-compose.offline.yml -f docker-compose.airgap.yml \
#     --env-file .env up -d
# =============================================================================

name: parking-app-offline

services:

  backend:
    image: parking-backend:v1.0.0
    pull_policy: never
    container_name: parking_backend
    restart: unless-stopped
    environment:
      DB_TYPE: couchbase
      # External Couchbase cluster. MUST include a scheme:
      #   couchbase://host (non-TLS) or couchbases://host (TLS).
      COUCHBASE_CONNECTION_STRING: ${COUCHBASE_CONNECTION_STRING}
      COUCHBASE_BUCKET: ${COUCHBASE_BUCKET}
      COUCHBASE_USERNAME: ${COUCHBASE_USERNAME}
      COUCHBASE_PASSWORD: ${COUCHBASE_PASSWORD}
      COUCHBASE_DEPLOYMENT: ${COUCHBASE_DEPLOYMENT:-enterprise}
      COUCHBASE_TLS_VERIFY: ${COUCHBASE_TLS_VERIFY:-none}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-0.5}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD}
      FIRST_ADMIN_COMPANY: ${FIRST_ADMIN_COMPANY:-Cebuana Lhuillier}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RUN_BACKGROUND_TASKS: ${RUN_BACKGROUND_TASKS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      UPLOAD_DIR: /var/lib/parking/uploads
    volumes:
      - parking_uploads:/var/lib/parking/uploads
    healthcheck:
      # The backend image ships curl (not wget); use it here.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    expose:
      - "8001"

  frontend:
    image: parking-frontend:v1.0.0
    pull_policy: never
    container_name: parking_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    # Override the baked-in healthcheck: Alpine wget resolves "localhost" to
    # IPv6 (::1) first, but nginx listens on IPv4 here — use 127.0.0.1.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  parking_uploads:
