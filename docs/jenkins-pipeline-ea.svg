<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6b7b"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#2c4f7c"/>
    </linearGradient>
    <style>
      .title    { fill:#ffffff; font-size:26px; font-weight:700; }
      .subtitle { fill:#cdd9e5; font-size:14px; }
      .lane     { fill:#f4f7fa; stroke:#d4dde6; stroke-width:1.5; }
      .lanelbl  { fill:#36506b; font-size:14px; font-weight:700; letter-spacing:.5px; }
      .stage    { fill:#ffffff; stroke:#2c4f7c; stroke-width:2; rx:10; }
      .stage-t  { fill:#15293f; font-size:15px; font-weight:700; }
      .stage-d  { fill:#53657a; font-size:11.5px; }
      .opt      { fill:#fffaf0; stroke:#d79b2b; stroke-width:2; rx:10; }
      .gate     { fill:#fff3f3; stroke:#c0392b; stroke-width:2; }
      .gate-t   { fill:#8e2a1f; font-size:12px; font-weight:700; }
      .io       { fill:#eef5ee; stroke:#4a8c54; stroke-width:1.5; rx:7; }
      .io-t     { fill:#2f6137; font-size:11px; }
      .flow     { stroke:#5b6b7b; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .flow-o   { stroke:#d79b2b; stroke-width:2; fill:none; stroke-dasharray:6 4; marker-end:url(#arrow); }
      .note     { fill:#7a8899; font-size:11px; }
      .legend-t { fill:#36506b; font-size:12px; }
      .pill     { font-size:11px; font-weight:700; }
    </style>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="88" fill="url(#hdr)"/>
  <text x="40" y="42" class="title">Cebuana Parking App — Jenkins CI/CD Pipeline</text>
  <text x="40" y="68" class="subtitle">Enterprise Architecture review view · declarative pipeline (Jenkinsfile) · agent with Docker, Python 3.11, Node 20</text>
  <text x="1560" y="42" text-anchor="end" class="subtitle">Trigger: SCM commit / manual build</text>
  <text x="1560" y="68" text-anchor="end" class="subtitle">Artifacts: container images · test reports · offline tarballs</text>

  <!-- ===================== LANE 1: SOURCE & VALIDATION ===================== -->
  <rect x="30" y="110" width="1540" height="150" class="lane" rx="10"/>
  <text x="48" y="134" class="lanelbl">1 · SOURCE &amp; VALIDATION</text>

  <rect x="70" y="150" width="230" height="86" class="stage"/>
  <text x="90" y="178" class="stage-t">Checkout</text>
  <text x="90" y="200" class="stage-d">Pull source from SCM</text>
  <text x="90" y="217" class="stage-d">Resolve image tag</text>
  <text x="90" y="231" class="stage-d">(param &gt; git tag &gt; build-sha)</text>

  <rect x="360" y="150" width="250" height="86" class="stage"/>
  <text x="380" y="178" class="stage-t">Validate Env File</text>
  <text x="380" y="200" class="stage-d">Check .env present + required</text>
  <text x="380" y="217" class="stage-d">COUCHBASE_* keys set</text>
  <text x="380" y="231" class="stage-d">(values never printed)</text>

  <polygon points="700,150 820,193 700,236 580,193" class="gate" transform="translate(70,0)"/>
  <text x="770" y="188" text-anchor="middle" class="gate-t">Credentials</text>
  <text x="770" y="204" text-anchor="middle" class="gate-t">valid?</text>

  <rect x="960" y="150" width="250" height="86" class="io"/>
  <text x="980" y="176" class="io-t" font-weight="700" fill="#2f6137">Inputs</text>
  <text x="980" y="196" class="io-t">• Git repository</text>
  <text x="980" y="212" class="io-t">• ENV_FILE (.env) — Couchbase + JWT</text>
  <text x="980" y="228" class="io-t">• Build parameters / switches</text>

  <rect x="1250" y="150" width="280" height="86" class="gate"/>
  <text x="1270" y="176" class="gate-t">FAIL FAST</text>
  <text x="1270" y="197" class="stage-d">Missing .env or Couchbase key</text>
  <text x="1270" y="214" class="stage-d">→ pipeline stops immediately,</text>
  <text x="1270" y="230" class="stage-d">   nothing built or shipped</text>

  <!-- ===================== LANE 2: BUILD & TEST (quality gate) ===================== -->
  <rect x="30" y="285" width="1540" height="230" class="lane" rx="10"/>
  <text x="48" y="309" class="lanelbl">2 · BUILD &amp; TEST  (quality gate — all run on every build)</text>

  <rect x="70" y="330" width="300" height="76" class="stage"/>
  <text x="90" y="357" class="stage-t">Backend Quality</text>
  <text x="90" y="379" class="stage-d">flake8 · black --check · mypy</text>
  <text x="90" y="395" class="stage-d">Python static analysis / style</text>

  <rect x="70" y="420" width="300" height="76" class="stage"/>
  <text x="90" y="447" class="stage-t">Backend Tests</text>
  <text x="90" y="469" class="stage-d">pytest (disposable Mongo DB)</text>
  <text x="90" y="485" class="stage-d">→ JUnit + coverage reports</text>

  <rect x="430" y="330" width="300" height="76" class="stage"/>
  <text x="450" y="357" class="stage-t">Frontend Quality</text>
  <text x="450" y="379" class="stage-d">yarn install · eslint</text>
  <text x="450" y="395" class="stage-d">React/JS static analysis</text>

  <rect x="430" y="420" width="300" height="76" class="stage"/>
  <text x="450" y="447" class="stage-t">Frontend Build</text>
  <text x="450" y="469" class="stage-d">yarn build (CRA/craco)</text>
  <text x="450" y="485" class="stage-d">→ production web bundle</text>

  <rect x="790" y="375" width="320" height="86" class="stage"/>
  <text x="810" y="403" class="stage-t">Build Images</text>
  <text x="810" y="425" class="stage-d">docker build backend + frontend</text>
  <text x="810" y="441" class="stage-d">Tag: registry/ns/app:version</text>
  <text x="810" y="457" class="stage-d">→ 2 container images</text>

  <rect x="1170" y="375" width="360" height="86" class="io"/>
  <text x="1190" y="401" class="io-t" font-weight="700" fill="#2f6137">Quality gate outputs</text>
  <text x="1190" y="421" class="io-t">• Test &amp; coverage reports (published)</text>
  <text x="1190" y="437" class="io-t">• Lint findings</text>
  <text x="1190" y="453" class="io-t">• Versioned container images (local)</text>

  <!-- ===================== LANE 3: RELEASE & DEPLOY (gated/optional) ===================== -->
  <rect x="30" y="540" width="1540" height="330" class="lane" rx="10"/>
  <text x="48" y="564" class="lanelbl">3 · RELEASE &amp; DEPLOY  (optional — each controlled by an on/off switch, default OFF)</text>

  <!-- Push -->
  <polygon points="150,600 260,638 150,676 40,638" class="gate" transform="translate(30,0)"/>
  <text x="180" y="634" text-anchor="middle" class="gate-t">PUSH_IMAGES?</text>
  <text x="180" y="650" text-anchor="middle" class="stage-d">on / off</text>
  <rect x="300" y="598" width="300" height="80" class="opt"/>
  <text x="320" y="625" class="stage-t">Push Images</text>
  <text x="320" y="647" class="stage-d">docker login (registry-creds)</text>
  <text x="320" y="663" class="stage-d">push both images → registry</text>

  <!-- Save -->
  <polygon points="150,710 260,748 150,786 40,748" class="gate" transform="translate(30,0)"/>
  <text x="180" y="744" text-anchor="middle" class="gate-t">SAVE_OFFLINE?</text>
  <text x="180" y="760" text-anchor="middle" class="stage-d">on / off</text>
  <rect x="300" y="708" width="300" height="80" class="opt"/>
  <text x="320" y="735" class="stage-t">Save Offline Bundle</text>
  <text x="320" y="757" class="stage-d">docker save → *.tar</text>
  <text x="320" y="773" class="stage-d">archive to offline-bundle/</text>

  <!-- Deploy -->
  <polygon points="760,655 870,693 760,731 650,693" class="gate" transform="translate(0,0)"/>
  <text x="760" y="689" text-anchor="middle" class="gate-t">DEPLOY?</text>
  <text x="760" y="705" text-anchor="middle" class="stage-d">on / off</text>

  <rect x="910" y="595" width="320" height="92" class="opt"/>
  <text x="930" y="622" class="stage-t">Deploy</text>
  <text x="930" y="644" class="stage-d">docker compose up -d</text>
  <text x="930" y="660" class="stage-d">--env-file .env (Couchbase creds)</text>
  <text x="930" y="676" class="stage-d">onprem / offline compose file</text>

  <rect x="910" y="705" width="320" height="80" class="opt"/>
  <text x="930" y="732" class="stage-t">Health Smoke Test</text>
  <text x="930" y="754" class="stage-d">deploy/health.sh</text>
  <text x="930" y="770" class="stage-d">frontend · backend · /api · DB</text>

  <rect x="1290" y="595" width="240" height="92" class="gate"/>
  <text x="1310" y="621" class="gate-t">DEPLOY FAILS</text>
  <text x="1310" y="642" class="stage-d">if any service not</text>
  <text x="1310" y="658" class="stage-d">healthy → marked</text>
  <text x="1310" y="674" class="stage-d">failed for rollback</text>

  <!-- ===================== LANE 4: OUTCOME ===================== -->
  <rect x="30" y="895" width="1540" height="110" class="lane" rx="10"/>
  <text x="48" y="919" class="lanelbl">4 · OUTCOME &amp; CLEANUP (always runs)</text>

  <rect x="300" y="930" width="300" height="60" class="io"/>
  <text x="320" y="957" class="stage-t" fill="#2f6137">SUCCESS ✓</text>
  <text x="320" y="978" class="stage-d">All stages passed · tag reported</text>

  <rect x="650" y="930" width="300" height="60" class="gate"/>
  <text x="670" y="957" class="gate-t">FAILURE ✗</text>
  <text x="670" y="978" class="stage-d">Stops at failing stage · logs flagged</text>

  <rect x="1000" y="930" width="300" height="60" class="stage"/>
  <text x="1020" y="957" class="stage-t">Cleanup</text>
  <text x="1020" y="978" class="stage-d">Workspace &amp; temp reports removed</text>

  <!-- ===================== FLOW ARROWS ===================== -->
  <!-- lane1 -->
  <path class="flow" d="M300,193 L358,193"/>
  <path class="flow" d="M610,193 L648,193"/>
  <!-- gate down to lane2 -->
  <path class="flow" d="M840,193 L915,193"/>
  <path class="flow" d="M770,236 L770,330"/>
  <text x="782" y="300" class="note">valid → proceed</text>
  <path class="flow-o" d="M770,236 L770,268 L1390,268 L1390,236"/>
  <text x="1060" y="285" class="note" fill="#8e2a1f">invalid → fail fast</text>

  <!-- lane2 internal -->
  <path class="flow" d="M220,406 L220,420"/>
  <path class="flow" d="M580,406 L580,420"/>
  <path class="flow" d="M370,368 L428,368"/>
  <path class="flow" d="M370,458 L428,458"/>
  <path class="flow" d="M730,418 L788,418"/>
  <path class="flow" d="M1110,418 L1168,418"/>

  <!-- lane2 to lane3 -->
  <path class="flow" d="M950,461 L950,520 L180,520 L180,598" />
  <text x="520" y="512" class="note">images ready → optional release/deploy stages evaluate their switch</text>

  <!-- lane3 gates to boxes -->
  <path class="flow" d="M290,638 L298,638"/>
  <path class="flow" d="M290,748 L298,748"/>
  <path class="flow" d="M180,676 L180,710"/>
  <path class="flow" d="M600,638 L760,638 L760,655"/>
  <path class="flow" d="M870,693 L908,641"/>
  <path class="flow" d="M1070,687 L1070,705"/>
  <path class="flow" d="M1230,641 L1288,641"/>

  <!-- lane3 to outcome -->
  <path class="flow" d="M1070,785 L1070,870 L450,870 L450,930"/>
  <path class="flow" d="M450,990 L450,1010"/>

  <!-- Legend -->
  <text x="40" y="1040" class="legend-t" font-weight="700">Legend:</text>
  <rect x="110" y="1028" width="26" height="16" class="stage"/>
  <text x="144" y="1041" class="legend-t">Always-run stage</text>
  <rect x="300" y="1028" width="26" height="16" class="opt"/>
  <text x="334" y="1041" class="legend-t">Optional stage (switch-controlled, default OFF)</text>
  <polygon points="700,1028 726,1036 700,1044 674,1036" class="gate"/>
  <text x="736" y="1041" class="legend-t">Decision / gate</text>
  <rect x="870" y="1028" width="26" height="16" class="io"/>
  <text x="904" y="1041" class="legend-t">Input / Output artifact</text>
  <line x1="1080" y1="1036" x2="1120" y2="1036" class="flow"/>
  <text x="1128" y="1041" class="legend-t">Normal flow</text>
  <line x1="1240" y1="1036" x2="1280" y2="1036" class="flow-o"/>
  <text x="1288" y="1041" class="legend-t">Failure / alt path</text>

  <text x="40" y="1085" class="note">Security note: Couchbase credentials and JWT secret are sourced only from the .env file at deploy time (docker compose --env-file); secret values are never written to build logs.</text>
  <text x="40" y="1105" class="note">Governance note: build, test and image packaging run on every commit; pushing to the registry, saving offline tarballs, and deploying are explicit, auditable opt-in actions.</text>
</svg>
